# Servicios de IA en el PC de escritorio. Todo local, sin coste.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # Para GPU NVIDIA, descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  stt:
    build: ./stt_server
    ports: ["8001:8001"]
    environment:
      WHISPER_MODEL: small          # tiny | base | small | medium
      WHISPER_COMPUTE: int8
    volumes: ["whisper-cache:/root/.cache"]
    restart: unless-stopped

  tts:
    build: ./tts_server
    ports: ["8002:8002"]
    environment:
      PIPER_VOICE: es_ES-sharvard-medium
    volumes: ["piper-voices:/voices"]
    restart: unless-stopped

volumes:
  ollama:
  whisper-cache:
  piper-voices:
