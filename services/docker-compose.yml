# Servicios de IA en el PC de escritorio. Todo local, sin coste.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b
services:
  ollama:
    # CPU por defecto. Para GPU:
    #   - AMD (ROCm): imagen ollama/ollama:rocm + los 'devices'/'group_add' de abajo
    #   - NVIDIA: imagen ollama/ollama:latest + el bloque 'deploy' de abajo
    image: ollama/ollama:rocm
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # --- AMD ROCm ---
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      # GIDs del host para video/render (ajústalos: getent group video render)
      - "983"
      - "987"
    security_opt:
      - seccomp:unconfined
    environment:
      # RX 6700/6700 XT/6750 XT (gfx1031) no está en la lista oficial: hazlo pasar por gfx1030
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    # --- NVIDIA (en vez de lo de arriba) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  stt:
    build: ./stt_server
    ports: ["8001:8001"]
    environment:
      WHISPER_MODEL: small          # tiny | base | small | medium
      WHISPER_COMPUTE: int8
    volumes: ["whisper-cache:/root/.cache"]
    restart: unless-stopped

  tts:
    build: ./tts_server
    ports: ["8002:8002"]
    environment:
      PIPER_VOICE: es_ES-sharvard-medium
    volumes: ["piper-voices:/voices"]
    restart: unless-stopped

volumes:
  ollama:
  whisper-cache:
  piper-voices:
