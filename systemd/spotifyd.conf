# spotifyd en la Pi. El nombre debe coincidir con skills.spotify.device_name de config.yaml.
# Instalar:  sudo apt install spotifyd   (o descargar el binario ARM de github.com/Spotifyd/spotifyd)
[global]
device_name = "asistente"
bitrate = 160
backend = "pulseaudio"          # PipeWire expone la API de PulseAudio
device_type = "speaker"
# Autenticación: usa el mismo flujo OAuth. spotifyd >= 0.3.5 admite:
use_mpris = false
# username / password NO son necesarios si ya hay sesión vía zeroconf en la LAN;
# para login headless añade:
#   username = "..."
#   password_cmd = "cat /home/pi/asistente/.spotify_password"
