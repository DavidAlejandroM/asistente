[project]
name = "asistente"
version = "0.1.0"
description = "Asistente de voz modular estilo Alexa para Raspberry Pi Zero 2 W"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Piezas que solo se instalan en la Pi / con hardware
audio = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",   # wheels precompilados (incl. ARM)
]
wakeword = [
    # openWakeWord fija tflite-runtime en Linux y no hay wheel para Python 3.13+.
    # Instálalo aparte sin deps y usa ONNX:
    #   pip install --no-deps "openwakeword>=0.6.0"
    "onnxruntime>=1.17",
    "scipy>=1.11",
    "tqdm>=4",
]
wakeword-vosk = [
    "vosk>=0.3.45",   # alternativa: la frase la eliges tú, sin entrenar
]
admin = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3",
    "python-multipart>=0.0.9",
    "starlette>=0.37",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
asistente = "asistente.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asistente.admin" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
